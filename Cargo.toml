[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
alien-core = { path = "crates/alien-core" }
alien-color = { path = "crates/alien-color" }
alien-tokens = { path = "crates/alien-tokens" }
alien-parser = { path = "crates/alien-parser" }
alien-ir = { path = "crates/alien-ir" }
alien-optimizer = { path = "crates/alien-optimizer" }
alien-emit = { path = "crates/alien-emit" }
alien-compiler = { path = "crates/alien-compiler" }
alien-cli = { path = "crates/alien-cli" }
alien-napi = { path = "crates/alien-napi" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
